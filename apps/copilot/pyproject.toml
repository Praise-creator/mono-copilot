[project]
name = "copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1.0",
    "fastapi[standard]>=0.139.0",
    "openai-agents>=0.17.7",
    "python-dotenv>=1.2.2",
    "weasyprint>=62.0",
    "markdown>=3.6",
    "textual>=0.60",
    "rich>=13.7",
    "httpx>=0.27",
    "pypdf>=4.3",
    "runtime",
    "textual>=0.22.0",
]

[project.scripts]
start = "copilot.main:run"
mono = "copilot.cli.__main__:main"

[tool.uv.sources]
runtime = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
